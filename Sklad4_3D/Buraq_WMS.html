<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buraq · Склад №4 · управление складом</title>
<style>
:root{
  --bg:#f4f5f7; --surf:#ffffff; --surf2:#f8f9fb; --line:#e3e6eb; --line2:#d3d8df; --ink:#16191e; --ink2:#4a525e; --muted:#7b8491;
  --acc:#d99a00; --acc2:#f5c518; --accInk:#1a1400; --blue:#2f6fd6; --ok:#2f9e5b; --warn:#d99a00; --bad:#d64545; --cyan:#0ea5b7;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05); --r:10px;
  --font:Inter,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono","IBM Plex Mono",Consolas,monospace;
  --nav:216px; --top:56px;
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surf:#161b22; --surf2:#1b212a; --line:#262d37; --line2:#323b47; --ink:#e7eaee; --ink2:#b4bcc6; --muted:#7f8995;
  --acc:#f5c518; --acc2:#f5c518; --accInk:#1a1400; --blue:#5b93f0; --ok:#3fbf73; --warn:#f2b705; --bad:#f06464; --cyan:#35c6d8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
#app{display:grid;grid-template-columns:var(--nav) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;height:100dvh}
/* ---------- навигация ---------- */
#nav{grid-row:1/3;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow:auto}
#brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
#brand i{width:30px;height:30px;border-radius:8px;background:var(--acc2);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--accInk);font-size:15px}
#brand b{display:block;font-size:14px;line-height:1.1} #brand span{font-size:11px;color:var(--muted)}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;color:var(--ink2);font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--surf2);color:var(--ink)} .nv.on{background:color-mix(in srgb,var(--acc2) 18%,transparent);color:var(--ink)}
.nv svg{width:18px;height:18px;flex:none;opacity:.85} .nv em{margin-left:auto;font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.nv em:empty{display:none}
#navfoot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 8px 2px;line-height:1.5}
/* ---------- верхняя полоса ---------- */
#top{display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--surf);border-bottom:1px solid var(--line);min-width:0}
#top h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}
#search{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:text}
#search kbd{margin-left:auto}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surf)}
.tb{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line2);background:var(--surf);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surf2);border-color:var(--muted)} .btn.pri{background:var(--acc2);border-color:var(--acc2);color:var(--accInk)} .btn.pri:hover{filter:brightness(.96)}
.btn.sm{padding:3px 8px;font-size:12.5px} .btn.ic{padding:6px 8px} .btn:disabled{opacity:.45;cursor:default}
#sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block} #sync.busy i{background:var(--warn);animation:pulse 1s infinite} #sync.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
#datebox{display:flex;align-items:center;gap:4px} #datebox input{border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:var(--surf)}
#datebox.past input{border-color:var(--acc);background:color-mix(in srgb,var(--acc2) 12%,var(--surf))}
/* ---------- страницы ---------- */
#main{overflow:auto;padding:20px 22px 40px;min-width:0;scroll-behavior:smooth}
.page{display:none;animation:fade .18s ease} .page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap} .ph h2{margin:0;font-size:22px;font-weight:650} .ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .tb{margin-left:auto;flex-wrap:wrap}
.grid{display:grid;gap:14px} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:2px;cursor:default} .kpi b{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15} .kpi b small{font-size:14px;font-weight:500;color:var(--muted)}
.kpi span{font-size:12.5px;color:var(--muted)} .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--line2)}
.kpi .bar{height:6px;border-radius:3px;background:var(--surf2);overflow:hidden;margin-top:6px} .kpi .bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)} .mut{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;line-height:18px}
.chip.d0{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)} .chip.d1{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 75%,var(--ink))} .chip.d2{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.n{background:var(--surf2);color:var(--ink2);border:1px solid var(--line)} .chip.b{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)} .chip.c{background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
/* список «требует внимания» */
.al{display:flex;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px;align-items:flex-start} .al:first-of-type{border-top:0}
.al:hover{background:var(--surf2)} .al i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none} .al b{font-weight:600} .al p{margin:0;font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}
/* таблицы */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);box-shadow:var(--shadow);max-height:calc(100dvh - 230px)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px} .t th{position:sticky;top:0;background:var(--surf2);z-index:1;text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t th.r,.t td.r{text-align:right} .t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap} .t tr:hover td{background:var(--surf2)} .t tbody tr{cursor:pointer}
.t th[data-s]::after{content:" ↕";opacity:.3} .t th.asc::after{content:" ↑";opacity:1} .t th.desc::after{content:" ↓";opacity:1}
.t td.w{white-space:normal;min-width:160px} .t .sub{font-size:11.5px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inp{border:1px solid var(--line2);background:var(--surf);border-radius:8px;padding:6px 10px;min-width:0} .inp:focus{outline:2px solid color-mix(in srgb,var(--acc2) 60%,transparent);border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surf)} .seg button{border:0;background:none;padding:5px 11px;cursor:pointer;border-right:1px solid var(--line);font-weight:500;color:var(--ink2)} .seg button:last-child{border-right:0}
.seg button.on{background:var(--acc2);color:var(--accInk)}
/* схема */
#planwrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;height:calc(100dvh - 170px);min-height:420px}
#plancard{padding:0;overflow:hidden;position:relative;touch-action:none}
#plan{width:100%;height:100%;display:block;cursor:grab;user-select:none} #plan.drag{cursor:grabbing}
#plan .cell{cursor:pointer} #plan .cell rect.bg{transition:fill .25s,stroke .15s} #plan .cell:hover rect.bg{stroke:var(--ink);stroke-width:.12}
#plan .cell.sel rect.bg{stroke:var(--blue);stroke-width:.22} #plan .cell.drop rect.bg{stroke:var(--acc);stroke-width:.3;stroke-dasharray:.4 .25}
#plan text{font-family:var(--font);pointer-events:none}
.pctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.pctl .btn{padding:4px 9px;font-size:16px;line-height:1;background:var(--surf)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--surf) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;backdrop-filter:blur(4px)}
.legend span{display:inline-flex;align-items:center;gap:5px} .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ptip{position:absolute;pointer-events:none;background:var(--surf);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;max-width:280px;display:none;z-index:5}
#side{display:flex;flex-direction:column;gap:14px;min-height:0} #side .card{overflow:auto}
.lot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px;background:var(--surf);cursor:grab;transition:border-color .15s,box-shadow .15s}
.lot:hover{border-color:var(--line2);box-shadow:var(--shadow)} .lot.on{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 25%,transparent)}
.lot b{font-weight:600} .lot .sub{color:var(--muted);font-size:11.5px} .lot .row{display:flex;gap:6px;align-items:center}
.lot .row .chip{margin-left:auto}
/* рейсы — канбан */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
.kcol h4{margin:0 2px 8px;font-size:13px;display:flex;gap:8px;align-items:center} .kcol h4 small{margin-left:auto;color:var(--muted);font-weight:400}
.tc{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tc:hover{transform:translateY(-1px);border-color:var(--line2)} .tc .h{display:flex;gap:8px;align-items:center} .tc .h b{font:600 13px var(--mono)} .tc .h .chip{margin-left:auto}
.tc .m{font-size:12.5px;color:var(--ink2);margin-top:4px} .tc .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.tc .pb{height:4px;border-radius:2px;background:var(--surf2);margin-top:7px;overflow:hidden} .tc .pb i{display:block;height:100%;background:var(--blue)}
/* панель справа (детали) */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surf);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .22s ease;z-index:40;display:flex;flex-direction:column}
#drawer.on{transform:none} #drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)} #drawer .dh h3{margin:0;font-size:17px;flex:1;min-width:0}
#drawer .db{overflow:auto;padding:14px 16px 30px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:6px 0 12px} .kv span{color:var(--muted)} .kv b{font-weight:500;text-align:right}
.tl{list-style:none;margin:8px 0 14px;padding:0 0 0 14px;border-left:2px solid var(--line)} .tl li{position:relative;padding:2px 0 10px 8px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surf);border:2px solid var(--line2)} .tl li.done::before{background:var(--ok);border-color:var(--ok)} .tl li.now::before{background:var(--acc2);border-color:var(--acc)}
.tl li small{display:block;color:var(--muted);font-size:12px}
#scrim{position:fixed;inset:0;background:rgba(10,14,20,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:39} #scrim.on{opacity:1;pointer-events:auto}
/* палитра команд */
#pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(10,14,20,.35)} #pal.on{display:flex}
#pal .box{width:min(620px,94vw);background:var(--surf);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:16px;background:var(--surf);outline:none}
#pal ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto} #pal li{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
#pal li.on{background:var(--surf2)} #pal li .k{font-size:11px;color:var(--muted);width:62px;flex:none;text-transform:uppercase;letter-spacing:.04em} #pal li .x{margin-left:auto;color:var(--muted);font-size:12px}
/* графики */
.chart{width:100%;height:220px;display:block} .chart text{font:11px var(--font);fill:var(--muted)} .chart .ax{stroke:var(--line)} .chart .gl{stroke:var(--line);stroke-dasharray:2 3}
/* уведомления */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--surf);padding:9px 16px;border-radius:9px;font-size:13px;transition:all .25s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55} .note b{color:var(--ink2)}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:8px;padding:9px 12px;font-size:13px;margin:10px 0}
.form{display:grid;grid-template-columns:200px 1fr;gap:10px 14px;align-items:center;font-size:13.5px} .form label{color:var(--ink2)}
textarea.inp{width:100%;min-height:110px;resize:vertical;font:12.5px var(--mono)}
/* плитки ячеек — для узкого экрана */
#tiles{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.tile{border:1px solid var(--line2);border-radius:8px;padding:6px 4px;text-align:center;background:var(--surf);font-size:11.5px;cursor:pointer;line-height:1.3}
.tile b{display:block;font-size:13px} .tile.sel{outline:2px solid var(--blue)} .tile.v{border-style:dashed} .tile .sub{color:var(--muted);font-size:10.5px}
/* мобильный */
#mnav{display:none}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} #planwrap{grid-template-columns:1fr;height:auto} #plancard{height:62vh} #side .card{max-height:none} .kan{grid-template-columns:1fr} }
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr 58px} #nav{display:none}
  #mnav{display:flex;grid-row:3;background:var(--surf);border-top:1px solid var(--line);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
  #mnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:6px 0;cursor:pointer}
  #mnav button.on{color:var(--ink)} #mnav svg{width:20px;height:20px}
  #tiles{display:grid} #datebox{display:none} #plancard{height:44vh}
  #top{padding:0 10px;gap:6px} #top h1{font-size:15px} #search span,#search kbd,#sync span,#datebox .btn{display:none} #search{flex:0 0 auto;margin-left:auto}
  #main{padding:14px 12px 30px} .g3,.g2,.g21{grid-template-columns:1fr} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi b{font-size:21px}
  .form{grid-template-columns:1fr} .tw{max-height:none}
}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <header id="top">
    <h1 id="ttl">Сводка</h1>
    <div id="search" title="Поиск по грузам, рейсам, клиентам и ячейкам"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Найти груз, рейс, клиента, ячейку…</span><kbd>Ctrl K</kbd></div>
    <div id="datebox"><input type="date" id="date" title="Показать склад на дату"><button class="btn sm" id="dnow">Сегодня</button></div>
    <div id="sync" title="Источник данных"><i></i><span id="synct">—</span></div>
    <button class="btn ic" id="reload" title="Обновить из таблицы (R)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="btn ic" id="theme" title="Светлая / тёмная тема"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <main id="main"></main>
  <div id="mnav"></div>
</div>
<div id="scrim"></div>
<aside id="drawer"><div class="dh"><h3 id="dttl"></h3><button class="btn ic" id="dclose" title="Закрыть (Esc)">✕</button></div><div class="db" id="dbody"></div></aside>
<div id="pal"><div class="box"><input id="palq" placeholder="Груз, клиент, рейс, ячейка или команда…" autocomplete="off"><ul id="pall"></ul></div></div>
<div id="toast"></div>
<script>
/* ==========================================================================
   BURAQ · СКЛАД №4 · УПРАВЛЕНИЕ СКЛАДОМ (WMS) — отдельный лёгкий файл без 3D.
   Данные — из таблиц Google (те же, что у режима «Учёт груза» в 3D-модели), размещение по ячейкам — здесь,
   в браузере (общий ключ с 3D-моделью: место, заданное здесь, видно и в 3D).
   Сборка: python3 build.py --wms → Buraq_WMS.html (общий разбор таблиц берётся из stock/00_data.js).
   ========================================================================== */
(()=>{
'use strict';
const DAY=86400000, KEY='buraq.wms.v1', VER='18.11.2026';
const S={today:null};
const BL={fs:'Fura statuslari',fsRows:[6,5,7,1,2,3,4,8],of:'Ortilgan furalar',ofRows:[2,1,3]};
const pad=n=>String(n).padStart(2,'0');
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmtD=d=>d?pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear():'—';
const fmtDs=d=>d?pad(d.getDate())+'.'+pad(d.getMonth()+1):'—';
const fmtN=(v,k)=>(+v||0).toLocaleString('ru-RU',{maximumFractionDigits:k===undefined?1:k});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dDiff=(a,b)=>Math.round((day0(a)-day0(b))/DAY);

function num(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  if(v==null) return 0;
  let s=String(v).replace(/[\s  ]/g,'');
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0) s=s.replace(/\./g,'');
  const x=parseFloat(s.replace(',','.')); return isFinite(x)?x:0;
}
const MON={янв:0,фев:1,мар:2,апр:3,мая:4,май:4,июн:5,июл:6,авг:7,сен:8,окт:9,ноя:10,дек:11,jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function date(v){
  if(v instanceof Date) return isNaN(v)?null:day0(v);
  if(v==null||v==='') return null;
  const s=String(v).trim(); let m;
  if((m=s.match(/^Date\((\d+),(\d+),(\d+)/))) return new Date(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; const d=new Date(y,+m[2]-1,+m[1]); return isNaN(d)?null:d; }
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\s.-]*([a-zа-яё]{3})/i))){ const mo=MON[m[2].toLowerCase()]; if(mo===undefined) return null;
    const r=today(); let d=new Date(r.getFullYear(),mo,+m[1]); if(d-r>60*DAY) d=new Date(r.getFullYear()-1,mo,+m[1]); return d; }
  return null;
}

/* ---------------------------------------------------------------- чтение таблицы Google: JSONP (работает и из файла на диске) */
let seq=0;
function gviz(id,params){
  return new Promise((res,rej)=>{
    const cb='__stk'+(++seq)+'_'+Date.now(), s=document.createElement('script'); let done=false;
    const fin=(f,v)=>{ if(done) return; done=true; clearTimeout(tm); window[cb]=()=>{}; s.remove(); f(v); };
    window[cb]=r=>{ if(r&&r.status==='ok'&&r.table) fin(res,r.table);
      else fin(rej,new Error((r&&r.errors&&r.errors[0]&&(r.errors[0].detailed_message||r.errors[0].message))||'таблица ответила ошибкой')); };
    const tm=setTimeout(()=>fin(rej,new Error('таблица не ответила — проверьте интернет и доступ по ссылке')),20000);
    s.onerror=()=>fin(rej,new Error('таблица недоступна: нет сети или доступ «всем, у кого есть ссылка» закрыт'));
    const q=Object.assign({tqx:'out:json;responseHandler:'+cb},params);
    s.src='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?'+Object.keys(q).map(k=>k+'='+encodeURIComponent(q[k])).join('&');
    document.head.appendChild(s);
  });
}
const cellV=c=>c==null?null:(c.v!=null?c.v:(c.f!=null?c.f:null));
const cellS=c=>c==null?'':String(c.f!=null?c.f:(c.v!=null?c.v:'')).trim();
function parseUrl(u){
  u=String(u||'').trim(); const m=u.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})/); if(!m) return /^[A-Za-z0-9_-]{30,}$/.test(u)?{id:u,gid:''}:null;
  const g=u.match(/[#?&]gid=(\d+)/); return {id:m[1],gid:g?g[1]:''};
}
/* шапка листа: строка row целиком как текст → {название: буква столбца} */
async function headerRow(id,sheet,row){
  const t=await gviz(id,{sheet,range:'A'+row+':AZ'+row,headers:0}); const out=[];
  if(t.rows&&t.rows[0]) t.rows[0].c.forEach((c,i)=>{ const s=cellS(c).replace(/\s+/g,' '); if(s) out.push({id:t.cols[i].id,label:s}); });
  return out;
}
async function findCols(id,sheet,rows,want,need){
  let best=null;
  for(const r of rows){
    let hs; try{ hs=await headerRow(id,sheet,r); }catch(e){ if(r===rows[0]) throw e; continue; }
    const got={}; for(const k in want){ const h=hs.find(h=>want[k].test(h.label)&&!Object.values(got).includes(h.id)); if(h) got[k]=h.id; }
    if(need.every(k=>got[k])) return {row:r,cols:got};
    if(!best||Object.keys(got).length>Object.keys(best.cols).length) best={row:r,cols:got};
  }
  const miss=need.filter(k=>!(best&&best.cols[k]));
  throw new Error('в листе «'+sheet+'» не нашёл столбцы: '+miss.join(', '));
}
const FS_WANT={reys:/^REYS NOMERI$/i,loaded:/^ORTILGAN SANA$/i,cn:/FURA RAQAMI HITOY/i,arr:/^HORGOS SANA$/i,out:/^QOZOQ FURA SANA$/i,kz:/FURA RAQAMI QOZOQ/i,tash:/^TOSHKENT SANA$/i};
const OF_WANT={mark:/SHIPPING MARK$/i,cargo:/YUK NOMI$/i,pack:/PACKING TYPE$/i,ctn:/(^|\s)CTN$/i,cbm:/(^|\s)CBM$/i,kg:/G\.?W\.?$/i,dest:/PUNKT NAZNACHENIYA$/i,reys:/REYS RAQAMI$/i};

/* рабочие таблицы Buraq: рейсы с датами (Fura statuslari) + состав рейсов (Ortilgan furalar). Берём только нужные столбцы. */
async function loadBL(id){
  const fs=await findCols(id,BL.fs,BL.fsRows,FS_WANT,['reys','arr','out']);
  const fk=Object.keys(fs.cols), ft=await gviz(id,{sheet:BL.fs,range:'A'+fs.row+':AZ6000',headers:1,tq:'select '+fk.map(k=>fs.cols[k]).join(',')+' where '+fs.cols.reys+' is not null'});
  const reys=[];
  ft.rows.forEach(r=>{ const o={}; fk.forEach((k,i)=>o[k]=r.c[i]); const code=cellS(o.reys); if(!/\d{4}/.test(code)) return;
    reys.push({code,loaded:date(cellV(o.loaded)),cn:cellS(o.cn).replace(/^-$/,''),arr:date(cellV(o.arr)),out:date(cellV(o.out)),kz:cellS(o.kz),tash:date(cellV(o.tash)),lots:[]}); });
  /* состав: только рейсы последних 150 дней и те, что ещё не уехали из Хоргоса */
  const t0=today(), need=reys.filter(r=>(r.arr&&dDiff(t0,r.arr)<=150)||(!r.out&&((r.loaded&&dDiff(t0,r.loaded)<=60)||r.arr)));
  const of=await findCols(id,BL.of,BL.ofRows,OF_WANT,['mark','cbm','reys']);
  const ok=Object.keys(of.cols), byCode={}; need.forEach(r=>byCode[r.code]=r);
  for(let i=0;i<need.length;i+=30){
    const part=need.slice(i,i+30), where=part.map(r=>of.cols.reys+" = '"+r.code.replace(/'/g,'')+"'").join(' or ');
    const ot=await gviz(id,{sheet:BL.of,headers:of.row,tq:'select '+ok.map(k=>of.cols[k]).join(',')+' where '+where});
    ot.rows.forEach(r=>{ const o={}; ok.forEach((k,j)=>o[k]=r.c[j]); const g=byCode[cellS(o.reys)]; if(!g) return;
      const cbm=num(cellV(o.cbm)), mark=cellS(o.mark); if(!mark&&!cbm) return;
      g.lots.push({mark:mark||'без метки',cargo:cellS(o.cargo),pack:cellS(o.pack),ctn:num(cellV(o.ctn)),cbm,kg:num(cellV(o.kg)),dest:cellS(o.dest),cell:''}); });
  }
  return {kind:'bl',name:'рабочие таблицы Buraq',reys:reys.filter(r=>r.lots.length||!r.out||(r.arr&&dDiff(t0,r.arr)<=150))};
}

/* простая таблица (шаблон): одна строка — один груз; столбцы находим по названиям на русском, английском или узбекском */
const ALIAS=[['cell',/ЯЧЕЙК|CELL|YACHEYKA|^АДРЕС/i],['mark',/SHIPPING\s*MARK|МАРК|КЛИЕНТ|MIJOZ|BELGI/i],['cargo',/CARGO\s*NAME|YUK NOMI|^ГРУЗ|НАИМЕН|ТОВАР/i],
  ['pack',/PACK|УПАК|ТАРА/i],['ctn',/CTN|件|МЕСТ|КОЛ-?ВО|QUANTITY|SONI/i],['cbm',/CBM|М3|М³|ОБЪ[ЕЁ]М|HAJM/i],
  ['kg',/^(T\/)?KG$|G\.?W\.?$|^ВЕС|^КГ|OG.?IRLIK/i],['out',/ОТГРУЖ|ДАТА ОТГ|УШ[ЁЕ]Л|ВЫБЫЛ|QOZOQ FURA SANA|JO.?NA/i],
  ['arr',/DATE OF ARRIV|ПРИБЫ|ПРИХОД|ДАТА ПРИ|HORGOS SANA|KELGAN/i],['reys',/PARTIYA|РЕЙС|REYS|ПАРТИЯ/i],
  ['dest',/НАЗНАЧ|PUNKT|^КУДА|MANZIL/i],['kz',/ФУРА|TRUCK|МАШИН/i],['note',/ПРИМЕЧ|NOTE|IZOH/i]];
function mapCols(labels){
  const got={}; ALIAS.forEach(([k,re])=>{ const i=labels.findIndex((l,i)=>l&&re.test(l)&&!/IN 1 CBM/i.test(l)&&!Object.values(got).includes(i)); if(i>=0) got[k]=i; });
  return got;
}
function fromRows(labels,rows,name){
  const c=mapCols(labels.map(l=>String(l||'').replace(/\s+/g,' ').trim()));
  if(c.mark===undefined||(c.cbm===undefined&&c.ctn===undefined)) throw new Error('в таблице нужны хотя бы столбцы SHIPPING MARK (клиент) и CBM (объём) — их названия не найдены в первой строке');
  const g=new Map(), get=(r,k)=>c[k]===undefined?null:r[c[k]];
  rows.forEach(r=>{ const mark=String(get(r,'mark')==null?'':get(r,'mark')).trim(), cbm=num(get(r,'cbm')), ctn=num(get(r,'ctn')); if(!mark||(!cbm&&!ctn)) return;
    const arr=date(get(r,'arr')), out=date(get(r,'out')), code=String(get(r,'reys')==null?'':get(r,'reys')).trim()||(arr?'приход '+fmtD(arr):'без даты');
    if(!g.has(code)) g.set(code,{code,loaded:null,cn:'',arr:null,out:null,kz:'',tash:null,lots:[],own:true});
    const G=g.get(code), s=k=>String(get(r,k)==null?'':get(r,k)).trim();
    G.lots.push({mark,cargo:s('cargo'),pack:s('pack'),ctn,cbm,kg:num(get(r,'kg')),dest:s('dest'),cell:s('cell').toUpperCase(),arr,out,kz:s('kz'),note:s('note')}); });
  g.forEach(G=>{ const a=G.lots.map(l=>l.arr).filter(Boolean); if(a.length) G.arr=new Date(Math.min.apply(null,a));
    if(G.lots.length&&G.lots.every(l=>l.out)) G.out=new Date(Math.max.apply(null,G.lots.map(l=>l.out))); G.kz=(G.lots.find(l=>l.kz)||{}).kz||''; });
  return {kind:'simple',name:name||'таблица',reys:[...g.values()]};
}
async function loadSimple(id,gid){
  const p={headers:1}; if(gid) p.gid=gid;
  const t=await gviz(id,p);
  return fromRows(t.cols.map(c=>c.label),t.rows.map(r=>r.c.map(cellV)),'таблица Google');
}
function fromText(txt){
  const lines=String(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2) throw new Error('вставьте таблицу вместе со строкой заголовков');
  const sep=lines[0].indexOf('\t')>=0?'\t':(lines[0].split(';').length>lines[0].split(',').length?';':',');
  const split=l=>{ if(sep==='\t') return l.split('\t'); const o=[]; let cur='',q=false;
    for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep&&!q){ o.push(cur); cur=''; } else cur+=ch; } o.push(cur); return o; };
  return fromRows(split(lines[0]),lines.slice(1).map(split),'вставленная таблица');
}
/* ссылка: сначала пробуем рабочие таблицы Buraq (два листа), иначе — простая таблица */
async function loadUrl(url){
  const p=parseUrl(url); if(!p) throw new Error('это не ссылка на таблицу Google');
  let bl=false; try{ const h=await headerRow(p.id,BL.fs,BL.fsRows[0]); bl=h.some(x=>FS_WANT.reys.test(x.label)); }catch(e){ if(/недоступна|не ответила/.test(e.message)) throw e; }
  return bl?loadBL(p.id):loadSimple(p.id,p.gid);
}

function calc(){
  const D=viewDate(), st={D,here:[],trips:{here:[],transit:[],gone:[]},cells:{},unplaced:[],marks:{},k:{}};
  CELLS.forEach(c=>st.cells[c.id]={c,lots:[],m3:0,tbl:false});
  const hist=TRIPS.filter(t=>t.loaded&&t.arr&&t.arr<=D).sort((a,b)=>a.arr-b.arr).slice(-12).map(t=>dDiff(t.arr,t.loaded)).filter(x=>x>=0&&x<40);
  st.transit=hist.length?Math.round(hist.reduce((a,b)=>a+b,0)/hist.length):6;
  TRIPS.forEach(t=>{ const here=t.lots.filter(l=>l.arr&&l.arr<=D&&(!l.out||l.out>=D));
    t.hereLots=here; t.status=''; t.days=null; t.eta=null;
    if(here.length){ t.status='here'; t.arrH=new Date(Math.min.apply(null,here.map(l=>l.arr))); t.days=dDiff(D,t.arrH); t.outToday=!!(t.out&&dDiff(t.out,D)===0); st.trips.here.push(t); }
    else if(t.arr&&t.out&&t.out<D){ t.status='gone'; t.dwell=dDiff(t.out,t.arr); st.trips.gone.push(t); }
    else if((t.loaded&&t.loaded<=D&&(!t.arr||t.arr>D))||(!t.loaded&&t.arr&&t.arr>D)){ t.status='transit';
      t.eta=t.arr||(t.loaded?new Date(t.loaded.getTime()+st.transit*DAY):null); t.plan=!t.arr; t.inD=t.eta?dDiff(t.eta,D):null; st.trips.transit.push(t); } });
  st.trips.here.sort((a,b)=>a.arrH-b.arrH||(a.code<b.code?-1:1)); st.trips.transit.sort((a,b)=>(a.eta||0)-(b.eta||0)); st.trips.gone.sort((a,b)=>b.out-a.out);
  st.trips.here.forEach((t,i)=>t.q=i+1);
  st.trips.here.forEach(t=>t.hereLots.forEach(l=>{ l.days=dDiff(D,l.arr); st.here.push(l);
    const ids=cellList(l.cellT); l.cellsT=ids.length>0; l.cells=ids.length?ids:(PL[l.key]||[]).filter(id=>CELL[id]);
    if(!l.cells.length) st.unplaced.push(l);
    else l.cells.forEach(id=>{ const cs=st.cells[id]; cs.lots.push(l); if(ids.length) cs.tbl=true; });
    const m=st.marks[l.mark]||(st.marks[l.mark]={mark:l.mark,lots:[],cbm:0,kg:0,ctn:0,maxDays:0,trips:new Set()});
    m.lots.push(l); m.cbm+=l.cbm; m.kg+=l.kg; m.ctn+=l.ctn; m.maxDays=Math.max(m.maxDays,l.days); m.trips.add(l.reys); }));
  /* объём по ячейкам: груз в нескольких ячейках заполняет их по очереди (как при размещении), последняя берёт остаток */
  const capc=capCell();
  st.here.filter(l=>l.cells.length).sort((a,b)=>(a.t.arrH-b.t.arrH)||(a.reys<b.reys?-1:a.reys>b.reys?1:0)||(a.mark<b.mark?-1:a.mark>b.mark?1:0)||(b.cbm-a.cbm)).forEach(l=>{ let rem=l.cbm; l.share={};
    l.cells.forEach((id,i)=>{ const cs=st.cells[id], v=i===l.cells.length-1?rem:Math.min(rem,Math.max(0,capc-cs.m3)); cs.m3+=v; l.share[id]=v; rem-=v; }); });
  /* предложение для груза без ячейки: рейсы по очереди от поста погрузки П2, каждый рейс — с новой свободной ячейки */
  const free=CELL_ORDER.filter(id=>!st.cells[id].lots.length), fill={}; st.sug={}; st.sugLeft=0;
  st.trips.here.forEach(t=>{ const ls=st.unplaced.filter(l=>l.reys===t.code).sort((a,b)=>a.mark<b.mark?-1:a.mark>b.mark?1:b.cbm-a.cbm); let cur=null;
    ls.forEach(l=>{ let rem=l.cbm; const ids=[];
      while(rem>1e-6){ if(!cur||fill[cur]>=capc-1e-6){ if(!free.length) break; cur=free.shift(); fill[cur]=0; }
        const v=Math.min(rem,capc-fill[cur]); fill[cur]+=v; rem-=v; if(!ids.includes(cur)) ids.push(cur); const cs=st.cells[cur]; cs.vm3=(cs.vm3||0)+v; (cs.vlots=cs.vlots||[]).includes(l)||cs.vlots.push(l); }
      if(ids.length) st.sug[l.key]=ids; l.vcells=ids; if(rem>0.05) st.sugLeft+=rem; }); });
  const K=st.k, sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  K.trips=st.trips.here.length; K.lots=st.here.length; K.cbm=sum(st.here,l=>l.cbm); K.kg=sum(st.here,l=>l.kg); K.ctn=sum(st.here,l=>l.ctn);
  K.marks=Object.keys(st.marks).length; K.cap=capAll(); K.fill=K.cap?K.cbm/K.cap:0;
  K.maxDays=st.here.length?Math.max.apply(null,st.here.map(l=>l.days)):0;
  K.avgDays=K.cbm?sum(st.here,l=>l.days*l.cbm)/K.cbm:0;
  K.late=st.here.filter(l=>l.days>CFG.norm); K.lateM3=sum(K.late,l=>l.cbm);
  K.unplacedM3=sum(st.unplaced,l=>l.cbm);
  K.heavy=st.here.filter(l=>l.ctn>0&&l.kg/l.ctn>CFG.placeKg);
  K.over=Object.values(st.cells).filter(c=>c.m3>capCell()+0.05);
  K.usedCells=Object.values(st.cells).filter(c=>c.lots.length).length;
  const g10=st.trips.gone.slice(0,10); K.avgDwell=g10.length?sum(g10,t=>t.dwell)/g10.length:null; K.maxDwell=g10.length?Math.max.apply(null,g10.map(t=>t.dwell)):null;
  K.lateShare=g10.length?g10.filter(t=>t.dwell>CFG.norm).length/g10.length:null;
  K.inToday=st.trips.transit.filter(t=>t.inD===0); K.outToday=st.trips.here.filter(t=>t.outToday);
  K.soon=st.trips.transit.filter(t=>t.inD!=null&&t.inD<=3); K.soonM3=sum(K.soon,t=>t.cbm);
  ST=st; alerts(); return st;
}

function alerts(){
  const st=ST, K=st.k, out=[];
  const add=(lvl,t,p,go)=>out.push({lvl,t,p,go});
  st.trips.here.filter(t=>t.days>CFG.norm).forEach(t=>add(2,'Рейс '+t.code+' стоит '+daysTxt(t.days),'дольше нормы ('+CFG.norm+' дн.) · '+fmtN(sum2(t.hereLots,'cbm'))+' м³'+(t.kz?' · фура '+t.kz:' · фура не назначена'),()=>openTrip(t)));
  if(K.fill>0.85) add(K.fill>1?2:1,'Буфер заполнен на '+Math.round(K.fill*100)+' %',fmtN(K.cbm,0)+' из '+fmtN(K.cap,0)+' м³',()=>go('plan'));
  const free=Math.max(0,K.cap-K.cbm);
  if(K.soonM3>free+0.5) add(2,'Приходящий груз не поместится','в ближайшие 3 дня ждём '+fmtN(K.soonM3,0)+' м³, свободно '+fmtN(free,0)+' м³ — нужна отгрузка раньше',()=>go('trips'));
  st.trips.transit.filter(t=>t.plan&&t.inD<0).forEach(t=>add(1,'Рейс '+t.code+' задерживается','ждали '+fmtDs(t.eta)+' (выехал '+fmtDs(t.loaded)+', в пути обычно '+st.transit+' дн.)',()=>openTrip(t)));
  st.trips.here.filter(t=>!t.out&&!t.kz&&t.days>=Math.max(1,CFG.norm-2)).forEach(t=>add(1,'Рейсу '+t.code+' пора назначить фуру','на складе '+daysTxt(t.days)+', казахская фура не указана',()=>openTrip(t)));
  if(K.over.length) add(2,'Ячейки переполнены: '+K.over.map(c=>c.c.id).join(', '),'в ячейке помещается '+fmtN(capCell())+' м³',()=>{ A.selCell=K.over[0].c.id; go('plan'); });
  if(st.unplaced.length) add(0,'Без ячейки: '+st.unplaced.length+' поз. · '+fmtN(K.unplacedM3)+' м³','на схеме склада — предложение, куда поставить; перетащите груз на ячейку или примите предложение целиком',()=>go('plan'));
  if(K.heavy.length) add(1,'Тяжёлые места: '+K.heavy.length,'больше '+fmtN(CFG.placeKg,0)+' кг на место — не в стоечный поддон: '+K.heavy.slice(0,4).map(l=>l.mark).join(', '),()=>{ A.lf.q=K.heavy[0].mark; go('lots'); });
  K.inToday.forEach(t=>add(0,'Сегодня прибывает '+t.code,fmtN(t.cbm,0)+' м³ · '+t.lots.length+' поз.',()=>openTrip(t)));
  K.outToday.forEach(t=>add(0,'Сегодня отгрузка '+t.code,(t.kz?'фура '+t.kz+' · ':'')+fmtN(sum2(t.hereLots,'cbm'))+' м³',()=>openTrip(t)));
  out.sort((a,b)=>b.lvl-a.lvl); ST.alerts=out;
}

const VB0={x:-4,y:-3.5,w:56.05,h:42.5};

function cellColor(cs){
  if(!cs.lots.length&&cs.vlots&&cs.vlots.length) return cellColor({lots:cs.vlots,m3:cs.vm3});

/* ---------- Аналитика: графики на SVG ---------- */
function occSeries(days){ const D=ST.D, out=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(D.getTime()-i*DAY); let v=0; LOTS.forEach(l=>{ if(l.arr&&l.arr<=d&&(!l.out||l.out>=d)) v+=l.cbm; }); out.push({d,v}); }
  return out; }
function occChart(days,h){
  const S2=occSeries(days), cap=capAll(), mx=Math.max(cap*1.1,Math.max.apply(null,S2.map(p=>p.v))*1.05), w=600, pl=36, pb=18, ph=(h||220)-pb-6;
  const X=i=>pl+(w-pl-6)*i/(S2.length-1), Y=v=>6+ph*(1-v/mx);
  let p='M'+X(0)+','+Y(0); S2.forEach((q,i)=>p+=' L'+X(i).toFixed(1)+','+Y(q.v).toFixed(1)); const area=p+' L'+X(S2.length-1)+','+Y(0)+' Z';
  let s='<svg class="chart" viewBox="0 0 '+w+' '+(h||220)+'" preserveAspectRatio="none" style="height:'+(h||220)+'px">';
  [0,0.5,1].forEach(k=>{ const v=mx*k; s+='<line class="gl" x1="'+pl+'" x2="'+(w-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtN(v,0)+'</text>'; });
  s+='<path d="'+area+'" fill="color-mix(in srgb,var(--blue) 18%,transparent)"/><path d="'+p.replace(/^M[^L]*L/,'M')+'" fill="none" stroke="var(--blue)" stroke-width="2"/>';
  s+='<line x1="'+pl+'" x2="'+(w-6)+'" y1="'+Y(cap)+'" y2="'+Y(cap)+'" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+(w-8)+'" y="'+(Y(cap)-4)+'" text-anchor="end" style="fill:var(--bad)">вместимость '+fmtN(cap,0)+' м³</text>';
  for(let i=0;i<S2.length;i+=Math.ceil(S2.length/6)) s+='<text x="'+X(i)+'" y="'+((h||220)-4)+'" text-anchor="middle">'+fmtDs(S2[i].d)+'</text>';
  return s+'</svg>';
}
function barChart(items,opt){
  const w=600,h=opt.h||220,pl=36,pb=34,ph=h-pb-8, mx=Math.max(opt.line||0,Math.max.apply(null,items.map(i=>i.v).concat([1])))*1.1, bw=(w-pl-6)/Math.max(1,items.length);
  const Y=v=>8+ph*(1-v/mx);
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px">';
  [0,0.5,1].forEach(k=>{ const v=mx*k; s+='<line class="gl" x1="'+pl+'" x2="'+(w-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtN(v,0)+'</text>'; });
  items.forEach((it,i)=>{ const x=pl+i*bw+bw*0.15, bh=Math.max(1,Y(0)-Y(it.v));
    s+='<rect x="'+x+'" y="'+Y(it.v)+'" width="'+(bw*0.7)+'" height="'+bh+'" rx="2" fill="'+(it.c||'var(--blue)')+'"><title>'+esc(it.t)+'</title></rect>';
    if(items.length<=24||i%2===0) s+='<text x="'+(x+bw*0.35)+'" y="'+(h-pb+14)+'" text-anchor="middle">'+esc(it.l)+'</text>'; });
  if(opt.line) s+='<line x1="'+pl+'" x2="'+(w-6)+'" y1="'+Y(opt.line)+'" y2="'+Y(opt.line)+'" stroke="var(--bad)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="'+(w-8)+'" y="'+(Y(opt.line)-4)+'" text-anchor="end" style="fill:var(--bad)">'+esc(opt.lineT)+'</text>';
  return s+'</svg>';
}

    +'<div class="card"><h3>Что это значит</h3><p class="note">'+statsText(avg,dw,peak,overDays)+'</p></div></div>';
}
function weekChart(wk){
  const w=600,h=220,pl=36,pb=26,ph=h-pb-8, mx=Math.max(1,...wk.map(x=>Math.max(x.vin,x.vout)))*1.1, bw=(w-pl-6)/wk.length, Y=v=>8+ph*(1-v/mx);
  let s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:'+h+'px">';
  [0,0.5,1].forEach(k=>{ const v=mx*k; s+='<line class="gl" x1="'+pl+'" x2="'+(w-6)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+fmtN(v,0)+'</text>'; });
  wk.forEach((x,i)=>{ const x0=pl+i*bw+bw*0.12, b=bw*0.36;
    s+='<rect x="'+x0+'" y="'+Y(x.vin)+'" width="'+b+'" height="'+(Y(0)-Y(x.vin))+'" rx="2" fill="var(--blue)"><title>приход '+fmtN(x.vin,0)+' м³</title></rect>';
    s+='<rect x="'+(x0+b+2)+'" y="'+Y(x.vout)+'" width="'+b+'" height="'+(Y(0)-Y(x.vout))+'" rx="2" fill="var(--acc)"><title>отгрузка '+fmtN(x.vout,0)+' м³</title></rect>';
    if(i%2===0) s+='<text x="'+(x0+b)+'" y="'+(h-8)+'" text-anchor="middle">'+fmtDs(x.b)+'</text>'; });
  s+='<rect x="'+(w-150)+'" y="6" width="10" height="10" fill="var(--blue)"/><text x="'+(w-136)+'" y="15">приход</text><rect x="'+(w-80)+'" y="6" width="10" height="10" fill="var(--acc)"/><text x="'+(w-66)+'" y="15">отгрузка</text>';
  return s+'</svg>';
}
function statsText(avg,dw,peak,overDays){
  const out=[];
  if(dw.length) out.push('Рейс стоит на складе в среднем <b>'+fmtN(avg)+' дн.</b>'+(avg>CFG.norm?' — дольше нормы '+CFG.norm+' дн.: груз ждёт казахскую фуру.':'.'));
  if(peak.v>capAll()) out.push('Пиковое заполнение <b>'+fmtN(peak.v,0)+' м³</b> больше вместимости стоечного буфера ('+fmtN(capAll(),0)+' м³): в такие дни груз стоит вне ячеек. Таких дней за 90 — <b>'+overDays+'</b>.');
  else out.push('Буфер ни разу не переполнялся: пик '+fmtN(peak.v,0)+' из '+fmtN(capAll(),0)+' м³.');
  out.push('Каждый лишний день простоя рейса ≈ '+fmtN(capAll()?ST.k.cbm/Math.max(1,ST.k.trips):0,0)+' м³ занятого места: сократить простой на день — освободить место под следующий рейс.');
  return out.join('<br><br>');
}

/* ---------- Настройки ---------- */
function pSet(){
  const n=Object.keys(PL).length;
  return '<div class="ph"><div><h2>Настройки</h2><p>Источник данных, нормы, вместимость и размещение</p></div></div><div class="grid g2">'
    +'<div class="card"><h3>Источник данных</h3><div class="form"><label>Ссылка на таблицу</label><div style="display:flex;gap:6px"><input class="inp" id="su" style="flex:1" value="'+esc(A.src.url||'')+'" placeholder="https://docs.google.com/spreadsheets/d/…"><button class="btn pri" id="sgo">Подключить</button></div>'
    +'<label>Сейчас</label><div>'+(A.data?esc(A.data.name)+' · '+A.data.reys.length+' рейсов · '+LOTS.length+' позиций':'нет данных')+(A.err?'<div class="bad" style="font-size:12.5px">'+esc(A.err)+'</div>':'')+'</div>'
    +'<label>Обновлять каждые</label><select class="inp" id="srf">'+[[60,'1 мин'],[120,'2 мин'],[300,'5 мин'],[900,'15 мин'],[0,'вручную']].map(([v,t])=>'<option value="'+v+'"'+(CFG.refresh===v?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'
    +'<p class="note">Таблица должна быть открыта «всем, у кого есть ссылка — читатель». Рабочие таблицы Buraq («Fura statuslari» + «Ortilgan furalar») распознаются сами; из них берутся только рейсы, даты, объёмы и названия грузов — телефоны и цены не читаются. Ссылка хранится только в этом браузере.</p>'
    +'<h3 style="margin-top:14px">Вставить таблицу</h3><textarea class="inp" id="stxt" placeholder="Скопируйте строки из Google Sheets или Excel вместе с заголовками: SHIPPING MARK, CARGO NAME, CTN, CBM, KG, DATE OF ARRIVE, РЕЙС, ЯЧЕЙКА, ДАТА ОТГРУЗКИ…"></textarea>'
    +'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" id="spaste">Загрузить вставленное</button><button class="btn" id="sdemo">Демо-данные</button></div></div>'
    +'<div class="card"><h3>Нормы и вместимость</h3><div class="form">'
    +'<label>Норма хранения, дней</label><input class="inp" type="number" min="1" max="60" id="snorm" value="'+CFG.norm+'">'
    +'<label>Объём одной стойки, м³</label><input class="inp" type="number" min="0.5" max="20" step="0.1" id="srack" value="'+CFG.rackM3+'">'
    +'<label>Штабелей в ячейке</label><input class="inp" type="number" min="1" max="6" id="sstk" value="'+CFG.stacks+'">'
    +'<label>Ярусов в штабеле</label><input class="inp" type="number" min="1" max="4" id="stier" value="'+CFG.tiers+'">'
    +'<label>Место тяжелее, кг — не в стойку</label><input class="inp" type="number" min="100" max="5000" step="50" id="skg" value="'+CFG.placeKg+'">'
    +'<label>Итого</label><b>ячейка '+fmtN(capCell())+' м³ · буфер '+fmtN(capAll(),0)+' м³ (30 ячеек)</b></div>'
    +'<h3 style="margin-top:16px">Размещение по ячейкам <small>'+n+' записей</small></h3>'
    +'<p class="note">Места, которые вы задаёте на схеме, хранятся в этом браузере и видны в 3D-модели (режим «Учёт груза»), если она открыта в этом же браузере. Чтобы перенести места в таблицу или на другой компьютер — выгрузите CSV.</p>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="pexp">Выгрузить места (CSV)</button><label class="btn">Загрузить места<input type="file" id="pimp" accept=".csv,.txt" hidden></label><button class="btn" id="pclean">Убрать места отгруженных</button><button class="btn" id="pclr">Очистить всё</button></div>'
    +'<h3 style="margin-top:16px">Вид</h3><div class="seg" id="sth">'+[['','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(([k,t])=>'<button data-t="'+k+'" class="'+(CFG.theme===k?'on':'')+'">'+t+'</button>').join('')+'</div>'
    +'<h3 style="margin-top:16px">Клавиши</h3><p class="note"><kbd>Ctrl K</kbd> или <kbd>/</kbd> — поиск и команды · <kbd>1</kbd>…<kbd>7</kbd> — разделы · <kbd>R</kbd> — обновить · <kbd>Esc</kbd> — закрыть</p></div></div>';

function bSet(){
  $('sgo').onclick=()=>connect($('su').value); $('su').onkeydown=e=>{ if(e.key==='Enter') connect($('su').value); };
  $('srf').onchange=e=>{ CFG.refresh=+e.target.value; store(); armRefresh(); toast('Сохранено'); };
  $('spaste').onclick=()=>{ try{ setData(fromText($('stxt').value),{kind:'paste',url:''}); toast('Загружено '+LOTS.length+' позиций'); go('dash'); }catch(e){ toast(e.message); } };
  $('sdemo').onclick=()=>{ setData(demo(),{kind:'demo',url:''}); go('dash'); };
  const num2=(id,k,mn,mx)=>$(id).onchange=e=>{ const v=+e.target.value; if(!(v>=mn&&v<=mx)){ toast('Значение от '+mn+' до '+mx); e.target.value=CFG[k]; return; } CFG[k]=v; store(); calc(); render(); };
  num2('snorm','norm',1,60); num2('srack','rackM3',0.5,20); num2('sstk','stacks',1,6); num2('stier','tiers',1,4); num2('skg','placeKg',100,5000);
  document.querySelectorAll('#sth button').forEach(b=>b.onclick=()=>{ CFG.theme=b.dataset.t; store(); theme(); render(); });
  $('pexp').onclick=()=>{ const by={}; LOTS.forEach(l=>by[l.key]=l);
    const L=[['Рейс','Клиент','Груз','м3','Ячейка']].concat(Object.keys(PL).map(k=>{ const l=by[k], p=k.split('|'); return [p[0],p[1],p[2],p[3].replace('.',','),PL[k].join(' ')]; }));
    download('места_в_ячейках_'+fmtD(today())+'.csv',L.map(r=>r.map(v=>/[;"]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v).join(';')).join('\r\n')); };
  $('pimp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ let n=0; t.replace(/^﻿/,'').split(/\r?\n/).slice(1).forEach(line=>{ const c=line.split(';').map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"'));
      if(c.length<5) return; const ids=cellList(c[4]); if(!ids.length) return; PL[[c[0],c[1],c[2],(+String(c[3]).replace(',','.')||0).toFixed(2)].join('|')]=ids; n++; }); savePL(); calc(); render(); toast('Загружено мест: '+n); }); };
  $('pclean').onclick=()=>{ const keep=new Set(ST.here.map(l=>l.key)); let n=0; Object.keys(PL).forEach(k=>{ if(!keep.has(k)&&LOTS.some(l=>l.key===k&&l.out&&l.out<ST.D)){ delete PL[k]; n++; } }); savePL(); calc(); render(); toast('Убрано записей: '+n); };
  $('pclr').onclick=()=>{ if(!confirm('Удалить все места, заданные на схеме?')) return; A.undo=JSON.parse(JSON.stringify(PL)); PL={}; savePL(); calc(); render(); toast('Места очищены'); };
}

/* ---------------------------------------------------------------- боковая панель, поиск, уведомления */
function openDrawer(t,html){ $('dttl').textContent=t; $('dbody').innerHTML=html; $('drawer').classList.add('on'); $('scrim').classList.add('on'); }
function closeDrawer(){ $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); }
let tt=0; function toast(m){ const e=$('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),2600); }
let palItems=[], palSel=0;
function palOpen(){ $('pal').classList.add('on'); const q=$('palq'); q.value=''; palFill(''); setTimeout(()=>q.focus(),0); }
function palClose(){ $('pal').classList.remove('on'); }
function palFill(q){
  q=q.trim().toLowerCase(); const it=[];
  PAGES.forEach(([k,t])=>it.push({k:'раздел',t,x:'',go:()=>go(k)}));
  it.push({k:'команда',t:'Обновить из таблицы',x:'R',go:()=>reload()},{k:'команда',t:'Разместить груз по предложению',x:'',go:()=>{ go('plan'); autoPlace(); }},{k:'команда',t:'Показать склад на сегодня',x:'',go:()=>setDate(null)});
  if(ST){ ST.trips.here.concat(ST.trips.transit,ST.trips.gone.slice(0,30)).forEach(t=>it.push({k:'рейс',t:t.code,x:{here:'на складе '+t.days+' дн.',transit:'в пути',gone:'отгружен'}[t.status],go:()=>openTrip(t)}));
    Object.values(ST.marks).forEach(m=>it.push({k:'клиент',t:m.mark,x:fmtN(m.cbm)+' м³ · '+m.lots.length+' поз.',go:()=>{ A.lf={st:'here',late:false,unplaced:false,mark:m.mark,q:''}; go('lots'); }}));
    CELLS.forEach(c=>{ const cs=ST.cells[c.id]; it.push({k:'ячейка',t:c.id,x:cs.lots.length?fmtN(cs.m3)+' м³ · '+cs.lots.length+' поз.':'свободна',go:()=>{ A.selCell=c.id; go('plan'); }}); });
    ST.here.forEach(l=>it.push({k:'груз',t:l.mark+' · '+l.cargo,x:l.reys+' · '+l.days+' дн.',go:()=>openLot(l)})); }
  palItems=(q?it.filter(i=>(i.k+' '+i.t+' '+i.x).toLowerCase().includes(q)):it.slice(0,PAGES.length+3)).slice(0,60); palSel=0; palDraw();
}
function palDraw(){ $('pall').innerHTML=palItems.map((i,n)=>'<li class="'+(n===palSel?'on':'')+'" data-n="'+n+'"><span class="k">'+i.k+'</span>'+esc(i.t)+'<span class="x">'+esc(i.x)+'</span></li>').join('')||'<li class="mut">Ничего не найдено</li>';
  document.querySelectorAll('#pall li[data-n]').forEach(li=>li.onclick=()=>{ palClose(); palItems[+li.dataset.n].go(); });
  const on=document.querySelector('#pall li.on'); if(on) on.scrollIntoView({block:'nearest'}); }
function setDate(d){ A.date=d&&dDiff(d,today())!==0?d:null; calc(); render(); }

/* ---------------------------------------------------------------- тема, клавиши, автообновление, запуск */
function theme(){ const t=CFG.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); document.documentElement.dataset.theme=t; }
let rT=0; function armRefresh(){ clearInterval(rT); if(CFG.refresh>0) rT=setInterval(()=>{ if(A.src.kind==='url'&&!A.busy&&!document.hidden&&!A.date) reload(true); },CFG.refresh*1000); }
function boot(){
  restore(); theme(); prep(); if(A.data) calc();
  $('search').onclick=palOpen; $('palq').oninput=e=>palFill(e.target.value);
  $('palq').onkeydown=e=>{ if(e.key==='ArrowDown'){ palSel=Math.min(palItems.length-1,palSel+1); palDraw(); e.preventDefault(); } else if(e.key==='ArrowUp'){ palSel=Math.max(0,palSel-1); palDraw(); e.preventDefault(); }
    else if(e.key==='Enter'&&palItems[palSel]){ const i=palItems[palSel]; palClose(); i.go(); } else if(e.key==='Escape') palClose(); };
  $('pal').onclick=e=>{ if(e.target.id==='pal') palClose(); };
  $('reload').onclick=()=>reload(); $('theme').onclick=()=>{ const cur=document.documentElement.dataset.theme; CFG.theme=cur==='dark'?'light':'dark'; store(); theme(); render(); };
  $('date').onchange=e=>setDate(e.target.value?new Date(e.target.value+'T00:00:00'):null); $('dnow').onclick=()=>setDate(null);
  $('dclose').onclick=closeDrawer; $('scrim').onclick=closeDrawer;
  addEventListener('keydown',e=>{ const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen(); return; }
    if(e.key==='Escape'){ palClose(); closeDrawer(); if(A.pick!=null){ A.pick=null; render(); } return; }
    if(typing) return;
    if(e.key==='/'){ e.preventDefault(); palOpen(); } else if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'){ reload(); } else if(/^[1-7]$/.test(e.key)) go(PAGES[+e.key-1][0]); });
  addEventListener('hashchange',()=>{ const p=location.hash.slice(1); if(p&&p!==A.page) go(p); });
  addEventListener('storage',e=>{ if(e.key===PLACE_KEY){ loadPL(); if(A.data){ calc(); render(); } } });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!CFG.theme){ theme(); render(); } });
  A.page=PAGES.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'dash';
  render(); armRefresh();
  if(A.src.kind==='url'&&Date.now()-A.at>60000) reload(true);
}
window.WMS={get A(){ return A; },get ST(){ return ST; },get LOTS(){ return LOTS; },get PL(){ return PL; },CFG,calc,render,go,setData,demo,autoPlace,place,reload,fromText,setDate,S};
boot();
})();
